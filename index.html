/* ----- Entrance animation: particles drift together and form the logo, then the app appears ----- */
function intro() {
  const box = $('#intro'), cv = $('#intro-c');
  if (!box || !cv || !cv.getContext) { if (box) box.remove(); return; }
  const ctx = cv.getContext('2d');
  const still = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  cv.width = W;
  cv.height = H;
  // Draw the logo on a hidden canvas; its filled pixels become the particle targets
  const off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  const oc = off.getContext('2d');
  const size = Math.min(W * 0.46, H * 0.26);
  oc.fillStyle = '#fff';
  oc.textAlign = 'center';
  oc.textBaseline = 'middle';
  oc.font = '600 ' + Math.round(size) + 'px Georgia, "Times New Roman", serif';
  oc.fillText('PS', W / 2, H / 2);
  const px = oc.getImageData(0, 0, W, H).data;
  const sample = step => {
    const out = [];
    for (let y = step >> 1; y < H; y += step) for (let x = step >> 1; x < W; x += step) {
      if (px[(y * W + x) * 4 + 3] > 128) out.push([x, y]);
    }
    return out;
  };
  let step = Math.max(2, Math.round(size / 60)), targets = sample(step);
  while (targets.length > 1600 && step < 40) { step++; targets = sample(step); }
  while (targets.length < 500 && step > 2) { step--; targets = sample(step); }
  const cols = document.documentElement.dataset.theme === 'dark' ? ['#cfeeda', '#9fdcb8', '#6fbf8e', '#8fd0c6', '#dff3e4'] : ['#1f4d36', '#2e6b4a', '#4f9a6a', '#2d7f86', '#7fbf8a'];
  const far = Math.max(W, H);
  const P = targets.map(([x, y], i) => {
    const a = Math.random() * Math.PI * 2, r = far * (0.6 + Math.random() * 0.5);
    return {x0: W / 2 + Math.cos(a) * r, y0: H / 2 + Math.sin(a) * r, tx: x, ty: y,
      d: 0.2 + Math.random() * 0.8, s: Math.random() * 6.3, z: (step > 4 ? 2 : 1.5) * dpr, c: cols[i % cols.length]};
  });
  const ease = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  const paint = t => {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      const e = ease(Math.min(1, Math.max(0, (t - p.d) / 1.2)));
      const wob = (1 - e) * Math.sin(t * 5 + p.s) * 10 * dpr;
      ctx.globalAlpha = 0.3 + 0.7 * e;
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x0 + (p.tx - p.x0) * e + wob, p.y0 + (p.ty - p.y0) * e + wob * 0.5, p.z, p.z);
    }
    ctx.globalAlpha = 1;
  };
  let done = false, raf = 0, timer = 0;
  const finish = () => {
    if (done) return;
    done = true;
    cancelAnimationFrame(raf);
    clearTimeout(timer);
    box.classList.add('out');
    setTimeout(() => box.remove(), 600);
  };
  box.addEventListener('pointerdown', finish);
  timer = setTimeout(finish, 4500);
  if (still) { paint(9); setTimeout(finish, 1200); return; }
  const t0 = performance.now();
  const loop = now => {
    const t = (now - t0) / 1000;
    paint(t);
    if (t >= 3.4) return finish();
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

/* ----- 2026 revision pack: each file goes to its matching subject in every department's first semester ----- */
const packPick = $('#packpick');
const PACK_RULES = [
  {re: /Physics_2002B_Model_Paper/i, key: 'physics', sec: 'classes', depts: 'all'},
  {re: /Maths_1002_Model_Paper/i, key: 'maths', sec: 'workbook', depts: 'all'},
  {re: /Physics_Module_/i, key: 'physics', sec: 'notes', depts: 'all'},
  {re: /Python_1131_Lab_Manual|Python_Lab_Extra_Questions/i, key: 'python', sec: 'lab', depts: ['comp']},
  {re: /Python_Module_/i, key: 'python', sec: 'classes', depts: ['comp']}
];
const MIME_BY_EXT = {pdf: 'application/pdf', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation'};
const extOf = n => (n.split('.').pop() || '').toLowerCase();
/* Every file inside a zip archive, folders left out */
async function zipEntries(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('not a zip file');
  const out = [];
  let p = dv.getUint32(e + 16, true);
  for (let i = 0; i < dv.getUint16(e + 10, true); i++) {
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    if (!name.endsWith('/')) {
      const lo = dv.getUint32(p + 42, true), start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      const raw = u8.subarray(start, start + size);
      out.push({name: name.split('/').pop(), bytes: method === 8 ? await inflate(raw) : raw});
    }
    p += 46 + nl + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
  }
  return out;
}
async function importPack(list) {
  const items = [];
  for (const f of list) {
    if (extOf(f.name) === 'zip') items.push(...await zipEntries(await f.arrayBuffer()));
    else items.push({name: f.name, bytes: new Uint8Array(await f.arrayBuffer())});
  }
  let placed = 0, already = 0;
  const skipped = [];
  for (const it of items) {
    const rule = PACK_RULES.find(r => r.re.test(it.name));
    if (!rule) { if (!/readme/i.test(it.name)) skipped.push(it.name); continue; }
    const depts = rule.depts === 'all' ? DEPTS.map(d => d.id) : rule.depts;
    for (const d of depts) {
      const s = d + '-y1s1.' + rule.key;
      if (!INST.some(x => x.id === s)) continue;
      if (files.some(x => x.s === s && x.c === rule.sec && x.name === it.name)) { already++; continue; }
      const type = MIME_BY_EXT[extOf(it.name)] || '';
      const blob = new File([it.bytes], it.name, {type: type});
      const rec = {id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), s: s, c: rule.sec, name: it.name, type: type, size: blob.size, added: Date.now(), blob: blob};
      try { await persistFile(rec); files.push(rec); placed++; }
      catch (err) { toast('Could not save ' + it.name + '. The browser may be out of space.'); return; }
    }
  }
  if (R.v === 'section') listFiles();
  let msg = placed ? 'Added ' + placed + (placed === 1 ? ' file' : ' files') + ' to your subjects.' : 'Nothing new to add.';
  if (already) msg += ' ' + already + ' already there.';
  if (skipped.length) msg += ' Not placed: ' + skipped.join(', ') + '.';
  if (memMode && placed) msg += ' This browser cannot keep files between visits.';
  toast(msg);
}
packPick.addEventListener('change', async () => {
  const picked = [...packPick.files];
  packPick.value = '';
  if (picked.length) await importPack(picked).catch(() => toast('That file could not be read. Try the zip again.'));
});

/* ----- Study Hub 2026.2: dashboard, focus timer, settings, recent files, share, offline notice ----- */
function greeting() {
  const h = new Date().getHours(), name = (localStorage.getItem('studyName') || '').trim();
  return (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + (name ? ', ' + name : '');
}
function touchRecent(id) {
  P.recent = [id].concat((P.recent || []).filter(x => x !== id)).slice(0, 8);
  saveP();
}
function sectionName(inst, cid) {
  const c = inst && inst.sec.find(x => x.id === cid);
  return c ? c.name : '';
}
function T() { return window.studyTimer || (window.studyTimer = {focus: 1500, brk: 300, mode: 'focus', left: 1500, on: null}); }
function mmss(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function timerHtml() {
  const t = T();
  return '<div class="timer"><div><span class="cont-k">' + (t.mode === 'focus' ? 'Focus' : 'Break') + '</span><b id="tmr">' + mmss(t.left) + '</b></div>' +
    '<div class="timer-btns"><button class="btn sm" data-x="timer">' + (t.on ? 'Pause' : 'Start') + '</button><button class="btn sm ghost" data-x="timer-reset">Reset</button><button class="btn sm ghost" data-x="timer-mode">' +
    (t.mode === 'focus' ? 'Break' : 'Focus') + '</button></div></div>';
}
function timerRefresh() {
  const card = document.querySelector('.timer'), t = T();
  if (!card) return;
  card.querySelector('.cont-k').textContent = t.mode === 'focus' ? 'Focus' : 'Break';
  card.querySelector('#tmr').textContent = mmss(t.left);
  card.querySelector('[data-x=timer]').textContent = t.on ? 'Pause' : 'Start';
  card.querySelector('[data-x=timer-mode]').textContent = t.mode === 'focus' ? 'Break' : 'Focus';
}
function timerStop() { const t = T(); if (t.on) clearInterval(t.on); t.on = null; }
function timerToggle() {
  const t = T();
  if (t.on) timerStop();
  else t.on = setInterval(() => {
    t.left--;
    if (t.left <= 0) {
      timerStop();
      t.mode = t.mode === 'focus' ? 'brk' : 'focus';
      t.left = t.mode === 'focus' ? t.focus : t.brk;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      toast(t.mode === 'focus' ? 'Break is over. Back to focus.' : 'Focus session done. Time for a break.');
    }
    timerRefresh();
  }, 1000);
  timerRefresh();
}
function timerReset() { timerStop(); const t = T(); t.mode = 'focus'; t.left = t.focus; timerRefresh(); }
function timerMode() { timerStop(); const t = T(); t.mode = t.mode === 'focus' ? 'brk' : 'focus'; t.left = t.mode === 'focus' ? t.focus : t.brk; timerRefresh(); }
function dashboardHtml() {
  const scores = P.hist.map(x => Math.round(x.s / x.n * 100));
  const best = scores.length ? Math.max(...scores) + '%' : '—';
  const inst = P.last && INST.find(x => x.id === P.last.s);
  const cont = inst ? '<button class="cont" ' + nav({v: 'section', s: P.last.s, c: P.last.c}) + '><span class="cont-k">Continue</span><b>' + esc(inst.name) + ' · ' +
    esc(sectionName(inst, P.last.c)) + '</b><small>' + esc(inst.where) + '</small></button>' : '';
  const recent = (P.recent || []).map(id => files.find(f => f.id === id)).filter(Boolean).slice(0, 4);
  const rec = recent.length ? '<h3 class="fh">Recent files</h3><div class="files">' + recent.map(f => frow(f)).join('') + '</div>' : '';
  return '<div class="dash"><div class="dash-stats"><div><b>' + files.length + '</b><small>Files saved</small></div><div><b>' + P.hist.length +
    '</b><small>Tests done</small></div><div><b>' + best + '</b><small>Best score</small></div></div>' + cont + timerHtml() + rec + '</div>';
}
function settingsHtml() {
  return '<div id="settings" hidden><div class="sheet-scrim" data-x="settings-close"></div>' +
    '<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="set-title"><div class="sheet-h"><b id="set-title">Settings</b>' +
    '<button class="btn sm ghost" data-x="settings-close">Done</button></div>' +
    '<label class="field">Your name (for the greeting)<input id="set-name" class="search" maxlength="30" placeholder="Your name" autocomplete="name"></label>' +
    '<div class="field"><span>Appearance</span><div class="seg seg3"><button data-x="theme" data-v="system" aria-pressed="true">Phone</button><button data-x="theme" data-v="light" aria-pressed="false">Light</button><button data-x="theme" data-v="dark" aria-pressed="false">Dark</button></div></div>' + '<div class="field"><span>Text size</span><div class="seg"><button data-x="text" data-v="normal" aria-pressed="true">Standard</button><button data-x="text" data-v="large" aria-pressed="false">Large</button></div></div>' +
    '<div class="field switch-row"><span>Reduce motion</span><button class="sw-btn" data-x="motion" aria-pressed="false" aria-label="Reduce motion"></button></div>' +
    '<div class="stack" style="margin-top:18px"><button class="btn ghost block" data-x="clear-recent">Clear recent files list</button>' +
    '<button class="btn danger block" data-x="delete-all">Delete all saved files</button></div>' +
    '<p class="muted" style="margin-top:16px">Polytechnic Study Hub, version 2026.3, with physics and Python notes. Your files and scores stay in this browser on this device.</p><p class="muted" style="margin-top:10px"><a href="privacy.html" style="color:var(--g2);font-weight:650">Privacy policy</a></p></section></div>';
}
function buildSettings() {
  document.body.insertAdjacentHTML('beforeend', settingsHtml());
  $('#set-name').addEventListener('change', e => {
    localStorage.setItem('studyName', e.target.value.trim());
    const h = $('.home-top .hero h2'); if (h) h.textContent = greeting();
  });
}
function syncSettings() {
  const large = document.documentElement.dataset.text === 'large', reduced = document.documentElement.dataset.motion === 'reduced';
  document.querySelectorAll('#settings [data-x=text]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.v === 'large') === large)));
  const m = document.querySelector('#settings [data-x=motion]'); if (m) m.setAttribute('aria-pressed', String(reduced));
  document.querySelectorAll('#settings [data-x=theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === themeChoice())));
  const n = $('#set-name'); if (n && document.activeElement !== n) n.value = localStorage.getItem('studyName') || '';
}
function openSettings() { if (!$('#settings')) buildSettings(); $('#settings').hidden = false; syncSettings(); }
function closeSettings() { const s = $('#settings'); if (s) s.hidden = true; }
function setText(v) {
  const large = v === 'large';
  document.documentElement.dataset.text = large ? 'large' : 'normal';
  localStorage.setItem('studyText', large ? 'large' : 'normal');
  syncSettings();
}
function toggleMotion() {
  const on = document.documentElement.dataset.motion !== 'reduced';
  document.documentElement.dataset.motion = on ? 'reduced' : 'full';
  localStorage.setItem('studyMotion', on ? 'reduced' : 'full');
  syncSettings();
}
function clearRecent() { P.recent = []; saveP(); render(true); toast('Recent files list cleared.'); }
async function deleteAll() {
  if (!confirm('Delete all saved files from this browser? This cannot be undone.')) return;
  if (!memMode) await run('readwrite', s => s.clear());
  files = []; P.recent = []; saveP();
  closeSettings(); render(true); toast('All saved files were deleted.');
}
async function shareFile(id) {
  const f = files.find(x => x.id === id);
  if (!f || !f.blob) return;
  const file = new File([f.blob], f.name, {type: f.type || ''});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) await navigator.share({files: [file], title: f.name});
    else toast('Sharing is not available here. Use Download instead.');
  } catch (err) { if (err && err.name !== 'AbortError') toast('This file could not be shared.'); }
}
function applyPrefs() {
  if (localStorage.getItem('studyText') === 'large') document.documentElement.dataset.text = 'large';
  if (localStorage.getItem('studyMotion') === 'reduced') document.documentElement.dataset.motion = 'reduced';
}
function netBanner() {
  const el = document.createElement('div');
  el.id = 'net'; el.setAttribute('role', 'status');
  el.textContent = 'You are offline. Files and practice still work. The AI assistant needs internet.';
  el.hidden = navigator.onLine;
  document.body.appendChild(el);
  const sync = () => { el.hidden = navigator.onLine; };
  window.addEventListener('online', sync);
  window.addEventListener('offline', sync);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-x]');
  if (!b) return;
  const x = b.dataset.x;
  if (x === 'timer') timerToggle();
  else if (x === 'timer-reset') timerReset();
  else if (x === 'timer-mode') timerMode();
  else if (x === 'settings') openSettings();
  else if (x === 'settings-close') closeSettings();
  else if (x === 'text') setText(b.dataset.v);
  else if (x === 'theme') setTheme(b.dataset.v);
  else if (x === 'motion') toggleMotion();
  else if (x === 'clear-recent') clearRecent();
  else if (x === 'delete-all') deleteAll();
  else if (x === 'share') shareFile(b.dataset.id);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });

/* ----- Dark mode: Phone setting, Light or Dark ----- */
function themeChoice() { return localStorage.getItem('studyTheme') || 'system'; }
function applyTheme() {
  const pref = themeChoice();
  const dark = pref === 'dark' || (pref === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#10231a' : '#1f4d36');
  syncThemeBtn();
}
function setTheme(v) { localStorage.setItem('studyTheme', v); applyTheme(); syncSettings(); }
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyPrefs();
applyTheme();
netBanner();
if ('ResizeObserver' in window && $('#assist-btn')) new ResizeObserver(placeThemeBtn).observe($('#assist-btn'));
placeThemeBtn();
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) toast('Study Hub was updated. Close and reopen it to use the new version.');
  });
}

/* ----- Dark mode button and bubble ----- */
function placeThemeBtn() {
  const a = $('#assist-btn');
  const w = a && a.getClientRects().length ? a.offsetWidth : 0;
  document.documentElement.style.setProperty('--fab-w', w + 'px');
}
function syncThemeBtn() {
  let b = $('#theme-btn');
  if (!b) {
    b = document.createElement('button');
    b.id = 'theme-btn';
    b.type = 'button';
    b.addEventListener('click', toggleDark);
    document.body.appendChild(b);
  }
  const dark = document.documentElement.dataset.theme === 'dark';
  b.setAttribute('aria-pressed', String(dark));
  b.setAttribute('aria-label', dark ? 'Dark mode is on. Tap for light mode.' : 'Dark mode is off. Tap for dark mode.');
  b.innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
let themeBusy = false;
function toggleDark() {
  if (themeBusy) return;
  const dark = document.documentElement.dataset.theme !== 'dark';
  const btn = $('#theme-btn');
  const reduce = document.documentElement.dataset.motion === 'reduced' || (!!window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (reduce || !btn || !btn.animate) { setTheme(dark ? 'dark' : 'light'); return; }
  const r = btn.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  themeBusy = true;
  btn.animate([{transform: 'scale(1)'}, {transform: 'scale(.8)'}, {transform: 'scale(1.12)'}, {transform: 'scale(1)'}], {duration: 380, easing: 'ease-out'});
  const bubble = document.createElement('div');
  bubble.id = 'theme-bubble';
  bubble.style.background = dark ? '#10231a' : '#fbfef8';
  document.body.appendChild(bubble);
  const grow = bubble.animate(
    [{clipPath: 'circle(0px at ' + x + 'px ' + y + 'px)'}, {clipPath: 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)'}],
    {duration: 650, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'forwards'});
  grow.onfinish = () => {
    setTheme(dark ? 'dark' : 'light');
    const fade = bubble.animate([{opacity: 1}, {opacity: 0}], {duration: 360, fill: 'forwards'});
    fade.onfinish = () => { bubble.remove(); themeBusy = false; };
  };
}
