<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polytechnic Study Hub</title><script>(function(){try{var p=localStorage.getItem("studyTheme")||"system";var d=p==="dark"||(p==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";if(localStorage.getItem("studyText")==="large")document.documentElement.dataset.text="large";if(localStorage.getItem("studyMotion")==="reduced")document.documentElement.dataset.motion="reduced";}catch(e){}})();</script>
<meta name="description" content="Notes, question papers, practice tests and an AI study assistant for polytechnic students.">
<meta name="theme-color" content="#1f4d36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>

:root{color-scheme:light;--g1:#1f4d36;--g2:#2e6b4a;--g3:#4f9a6a;--ink:#173127;--ink2:#56705f;--line:rgba(46,107,74,.16);--glass:rgba(255,255,255,.8);--shadow:0 14px 34px -18px rgba(23,49,39,.38);--ok:#1d7a48;--bad:#b2281f}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#e8f4df}
body{margin:0;min-height:100vh;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:transparent;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3,h4,p{margin:0}
h2{font:600 26px/1.15 Georgia,"Times New Roman",serif;color:var(--g1)}
h3.fh{font:600 19px/1.2 Georgia,"Times New Roman",serif;color:var(--g1);margin:26px 2px 10px}
.muted,small{color:var(--ink2)}
#scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#scene svg{width:100%;height:100%;display:block}
.cl{animation:drift 30s ease-in-out infinite alternate}
.cl.cl2{animation-duration:40s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(50px)}}
.shine path{animation:shine 5.5s ease-in-out infinite}
.shine path:nth-child(2){animation-delay:-1.8s}
.shine path:nth-child(3){animation-delay:-3.2s}
.shine path:nth-child(4){animation-delay:-4.4s}
@keyframes shine{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(16px)}}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;min-height:60px;padding:0 12px;background:rgba(31,77,54,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;box-shadow:0 8px 24px -14px rgba(10,35,25,.6)}
.top h1{font:600 19px/1.2 Georgia,"Times New Roman",serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;letter-spacing:.01em}
#back{flex:0 0 42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:28px;line-height:1;transition:background .2s,transform .15s}
#back:hover{background:rgba(255,255,255,.2)}
#back:active{transform:scale(.94)}
#back[hidden]{display:none}
.hero{margin:18px auto 0;max-width:728px;width:calc(100% - 32px);padding:22px 22px 20px;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(220,240,214,.88));border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow)}
.hero p{color:var(--ink2);margin-top:4px}
.hero.small{margin-top:14px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
.search{display:block;width:100%;height:52px;margin:0;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:var(--glass);box-shadow:0 8px 20px -16px rgba(23,49,39,.5);font-size:16px;outline:none;transition:box-shadow .2s,border-color .2s}
.search:focus{border-color:var(--g3);box-shadow:0 0 0 4px rgba(79,154,106,.2)}
#hq{margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
.files{display:grid;gap:10px;margin-top:12px}
.subj,.row,.frow{display:flex;align-items:center;gap:14px;width:100%;border:1px solid rgba(255,255,255,.85);background:var(--glass);color:var(--ink);text-align:left;border-radius:20px;box-shadow:0 10px 26px -18px rgba(23,49,39,.45);transition:transform .22s ease,box-shadow .22s ease,background .22s}
.row,.frow{padding:14px 16px;min-height:70px}
.frow{min-height:66px}
.subj{flex-direction:column;align-items:flex-start;gap:8px;padding:16px;min-height:150px}
.row:hover,.frow:hover,.subj:hover{transform:translateY(-2px);box-shadow:0 16px 32px -18px rgba(23,49,39,.5);background:rgba(255,255,255,.94)}
.row:active,.frow:active,.subj:active{transform:scale(.985)}
.ft{display:flex;flex-direction:column;min-width:0;flex:1}
.ft b{font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.list > .row .ft b{white-space:normal;overflow-wrap:anywhere}
.subj b{font:600 19px/1.2 Georgia,"Times New Roman",serif;color:var(--g1)}
.subj small,.row small,.ft small{font-size:13px;line-height:1.35;color:var(--ink2)}
.subj em{font-style:normal;font-weight:650;font-size:13px;color:var(--fg,var(--g2));margin-top:auto}
.chev{color:var(--ink2);font-size:24px;line-height:1;opacity:.6;transition:transform .2s,opacity .2s}
.row:hover .chev{transform:translateX(3px);opacity:1}
.ico{display:grid;place-items:center;flex:0 0 46px;width:46px;height:46px;border-radius:15px;background:var(--bg);color:var(--fg);font:700 14px/1 system-ui;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.ico svg{width:24px;height:24px}
.subj .ico{width:44px;height:44px}
.c-blue{--bg:#e2edfb;--fg:#1f5fa3}
.c-teal{--bg:#dcf2ee;--fg:#0c6b6e}
.c-violet{--bg:#ece6fb;--fg:#5b3fa3}
.c-amber{--bg:#fcefd0;--fg:#7a5300}
.c-green{--bg:#dff3e3;--fg:#1d7a48}
.c-slate{--bg:#e8edf1;--fg:#3f4b5c}
.badge{display:grid;place-items:center;flex:0 0 48px;width:48px;height:48px;border-radius:14px;font:700 11px/1 system-ui;letter-spacing:.04em}
.k-docs{background:#e2edfb;color:#1f5fa3}.k-photo{background:#fcefd0;color:#7a5300}.k-video{background:#dcf2ee;color:#0c6b6e}.k-audio{background:#ece6fb;color:#5b3fa3}.k-other{background:#e8edf1;color:#3f4b5c}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:46px;padding:0 20px;border:0;border-radius:14px;background:linear-gradient(135deg,#43965f,#2e6b4a);color:#fff;font-weight:650;text-decoration:none;text-align:center;box-shadow:0 10px 20px -12px rgba(46,107,74,.9);transition:transform .15s,filter .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 26px -12px rgba(46,107,74,.95)}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:38px;padding:0 15px;font-size:14px;border-radius:12px}
.btn.ghost{background:rgba(255,255,255,.92);color:var(--g2);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:rgba(255,255,255,.92);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(178,40,31,.25)}
.btn.block{display:flex;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.bar .search{flex:1;min-width:160px;height:46px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;margin-top:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.9);font-size:14px;font-weight:600;color:var(--ink2);transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--g1);border-color:var(--g1);color:#fff}
.meta{margin-top:10px;font-size:13px;color:var(--ink2)}
.hint{margin-top:10px;font-size:14px;color:var(--ink2)}
.foot{margin:26px 0 0;text-align:center;font-size:13px;color:var(--ink2)}
.foot .chip{margin-left:6px;vertical-align:middle}
.empty{margin-top:14px;padding:26px 22px;text-align:center;border:1.5px dashed rgba(46,107,74,.35);border-radius:20px;background:rgba(255,255,255,.6);color:var(--ink2)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#fffdf3,#fdf3d6);border:1px solid rgba(230,167,35,.35);box-shadow:var(--shadow)}
.resume b{display:block;color:var(--g1)}
.sechead{margin-top:8px}
.sechead small{display:block;color:var(--ink2);font-weight:600;letter-spacing:.02em}
details{margin-top:12px;padding:0 16px 16px;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 26px -18px rgba(23,49,39,.45);backdrop-filter:blur(8px)}
summary{display:flex;flex-direction:column;gap:2px;padding:16px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{color:var(--g2);font-weight:650}
summary b{font:600 19px/1.2 Georgia,"Times New Roman",serif;color:var(--g1)}
details h4{margin:14px 0 4px;color:var(--g2);font-size:15px}
details ul{margin:0;padding-left:20px}
details li{margin:4px 0;font-size:15px}
.intro{margin:0 0 6px;font-size:15px;color:var(--ink2)}
.tip{margin:14px 0;padding:12px 14px;border-radius:14px;background:#fdf3d6;color:#7a5300;font-size:14px}
.mock{margin-top:16px;padding:20px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(220,242,238,.9));border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow)}
.mock h2{font-size:22px;margin-bottom:6px}
.mock p{margin:0 0 14px;color:var(--ink2)}
.mod{padding:16px;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 26px -18px rgba(23,49,39,.45)}
.mod small{color:var(--ink2);font-weight:600}
.mod b{display:block;font:600 19px/1.25 Georgia,"Times New Roman",serif;color:var(--g1);margin:3px 0 4px}
.mod p{margin:0 0 12px;color:var(--ink2);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;margin-top:16px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid var(--line)}
.tabs button{min-height:42px;border:0;border-radius:12px;background:transparent;color:var(--ink2);font-weight:650;transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:#fff;color:var(--g1);box-shadow:0 6px 16px -10px rgba(23,49,39,.5)}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:16px}
.qhead h2{font-size:22px}
.qhead small{display:block;margin-top:2px}
.pbar{height:9px;margin:14px 0;border-radius:99px;background:rgba(46,107,74,.14);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f9a6a,#2e6b4a);transition:width .5s ease}
.card{margin-top:14px;padding:18px;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 26px -18px rgba(23,49,39,.45);backdrop-filter:blur(8px)}
.card small{font-weight:700;color:var(--g2);letter-spacing:.02em}
.card h3{font:600 17px/1.5 system-ui;margin:6px 0 0;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:50px;padding:11px 13px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);text-align:left;transition:border-color .2s,background .2s,transform .15s}
.opt:not([disabled]):hover{border-color:var(--g3)}
.opt:not([disabled]):active{transform:scale(.99)}
.opt b{flex:0 0 28px;width:28px;height:28px;border:1.6px solid var(--ink2);border-radius:50%;display:grid;place-items:center;font-size:12px;transition:all .2s}
.opt span{min-width:0;overflow-wrap:anywhere;line-height:1.4}
.opt em{display:block;margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--ok)}
.opt.sel{border-color:var(--g2);background:#eef8f0}.opt.sel b{background:var(--g2);border-color:var(--g2);color:#fff}
.opt.ok{border-color:var(--ok);background:#e6f6ec}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#fcebe9}.opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.why{margin-top:12px;padding:12px 14px;border-radius:14px;background:#f0f7f1;font-size:14px;color:var(--ink2)}
.dock{position:sticky;bottom:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px -16px 0;padding:13px 16px calc(13px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -12px 30px -22px rgba(23,49,39,.5)}
.dock span{font-weight:650;color:var(--ink)}
.result{margin-top:16px;padding:22px;border-radius:24px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.score{font:600 56px/1 Georgia,"Times New Roman",serif;margin:8px 0 6px;color:var(--g1)}
.score span{font:500 18px system-ui;color:var(--ink2)}
.per{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}
.per div{padding:12px;border-radius:14px;background:#f5faf6;border:1px solid var(--line)}
.per b{display:block;font-size:14px;color:var(--ink)}
.per small{color:var(--ink2)}
.stack{display:grid;gap:10px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats div{padding:14px 12px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 24px -18px rgba(23,49,39,.45)}
.stats b{display:block;font:600 24px/1.1 Georgia,"Times New Roman",serif;color:var(--g1)}
.stats small{font-size:12px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 24px -18px rgba(23,49,39,.45)}
.hrow b{display:block;color:var(--ink)}
.preview{display:grid;place-items:center;min-height:220px;margin-top:14px;border-radius:22px;background:radial-gradient(circle at 50% 30%,#2a4a3b,#10231a);color:#e4f0e8;overflow:hidden;box-shadow:var(--shadow)}
.preview img,.preview video{display:block;max-width:100%;max-height:70vh}
.preview audio{margin:18px;width:calc(100% - 36px)}
.preview iframe{display:block;width:100%;height:70vh;border:0;background:#fff}
.preview pre{align-self:stretch;margin:0;padding:16px;max-height:70vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:#e4f0e8;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace}
.preview p{padding:26px;text-align:center;color:#cfe3d4}
.facts{margin:14px 0 0;padding:4px 16px;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 24px -18px rgba(23,49,39,.45)}
.facts div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.facts div:last-child{border-bottom:0}
.facts dt{color:var(--ink2);font-size:14px}
.facts dd{margin:0;font-weight:650;text-align:right;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.facts select{max-width:100%;min-height:42px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
#pick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ag-set{display:grid;gap:10px;padding:14px;border:1px dashed rgba(46,107,74,.35);border-radius:16px;background:rgba(255,255,255,.6)}
.ag-set label,.assist label{display:grid;gap:5px;font-size:14px;color:var(--ink2);font-weight:600}
.ag-txt{margin-top:7px;white-space:pre-wrap;font-size:15px;line-height:1.6;color:var(--ink)}
.doubt{padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px -16px rgba(23,49,39,.4);animation:rise .4s cubic-bezier(.2,.7,.2,1) backwards}
.doubt.done{opacity:.55}
.doubt b{display:block;font-size:15px;color:var(--g1)}
.doubt small{color:var(--ink2)}
.ask{display:flex;gap:8px}
.ask .search{flex:1;height:46px;margin:0}
.assist-btn{position:fixed;right:16px;bottom:20px;z-index:12;height:50px;padding:0 20px;border:0;border-radius:26px;background:linear-gradient(135deg,#4f9a6a,#1f4d36);color:#fff;font-weight:700;letter-spacing:.02em;box-shadow:0 16px 30px -12px rgba(31,77,54,.8);transition:transform .2s,box-shadow .2s}
.assist-btn:hover{transform:translateY(-2px);box-shadow:0 20px 34px -12px rgba(31,77,54,.85)}
.assist-btn[hidden]{display:none}
.assist{position:fixed;z-index:13;top:0;right:0;bottom:0;width:min(400px,100%);display:flex;flex-direction:column;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-left:1px solid var(--line);box-shadow:-18px 0 44px -24px rgba(23,49,39,.5);animation:sheetIn .42s cubic-bezier(.2,.7,.2,1)}
.assist[hidden]{display:none}
@keyframes sheetIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.assist-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line)}
.assist-h b{font:600 18px/1.2 Georgia,"Times New Roman",serif;color:var(--g1)}
.assist-acts{display:flex;gap:6px}
.assist-b{flex:1;overflow:auto;padding:16px 18px;display:grid;align-content:start;gap:12px}
.assist-f{display:grid;gap:9px;padding:14px 18px 18px;border-top:1px solid var(--line);background:rgba(255,255,255,.7)}
.assist select,.assist textarea,.assist input{width:100%;min-height:44px;padding:9px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit;font-size:15px;color:var(--ink);outline:none}
.assist textarea{min-height:66px;resize:vertical}
.assist select:focus,.assist textarea:focus,.assist input:focus{border-color:var(--g3);box-shadow:0 0 0 3px rgba(79,154,106,.2)}
.as-out{display:grid;gap:10px}
.as-out:empty{display:none}
@media (max-width:640px){.assist{top:auto;left:0;right:0;height:80vh;width:auto;border-left:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;animation:sheetUp .42s cubic-bezier(.2,.7,.2,1)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
body.in-quiz .assist-btn{display:none}
#toast{position:fixed;left:50%;bottom:20px;z-index:30;max-width:calc(100% - 32px);padding:12px 18px;border-radius:16px;background:rgba(23,49,39,.94);color:#fff;font-size:14px;font-weight:600;text-align:center;box-shadow:0 14px 30px -14px rgba(10,35,25,.7);opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.go-fwd{animation:slideInR .45s cubic-bezier(.2,.7,.2,1) backwards}
.go-back{animation:slideInL .45s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes slideInR{from{opacity:0;transform:translate3d(32px,0,0)}to{opacity:1;transform:none}}
@keyframes slideInL{from{opacity:0;transform:translate3d(-32px,0,0)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0) * 55ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 38%,#fbfef8 0%,#e7f5df 62%,#d6ecc9 100%);overflow:hidden;transition:opacity .6s ease}
#intro.out{opacity:0;pointer-events:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#intro .intro-t{position:absolute;left:0;right:0;bottom:24%;margin:0;text-align:center;color:var(--g1);font:600 clamp(18px,4.6vw,24px)/1.2 Georgia,"Times New Roman",serif;letter-spacing:.02em;opacity:0;animation:introIn .8s 2.1s forwards}
#intro .intro-skip{position:absolute;left:0;right:0;bottom:9%;margin:0;text-align:center;color:#5d7a67;font-size:13px;opacity:0;animation:introIn .6s 1.2s forwards}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}#intro .intro-skip{display:none}}
@media (max-width:360px){.grid{gap:10px}.subj b{font-size:17px}.hero h2{font-size:23px}}


/* home layout: heading and search on top, departments on the left, same-size cards */
.home-top{display:grid;gap:14px;max-width:760px;margin:18px auto 0;padding:0 16px}
.home-top .hero{margin:0;width:auto;max-width:none}
.home-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.home-tools #hq{margin:0}
.assist-state{display:inline-flex;align-items:center;gap:9px;min-height:52px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--glass);box-shadow:0 8px 20px -16px rgba(23,49,39,.5);color:var(--ink);font-size:14px;font-weight:650;white-space:nowrap;transition:background .2s,box-shadow .2s}
.assist-state:hover{background:#fff;box-shadow:0 12px 24px -16px rgba(23,49,39,.55)}
.assist-state .lbl{color:var(--ink2)}
.assist-state .sw{position:relative;flex:0 0 auto;width:40px;height:23px;border-radius:999px;background:#c5d6c9;transition:background .25s}
.assist-state .sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s}
.assist-state.on .sw{background:var(--g3)}
.assist-state.on .sw::after{transform:translateX(17px)}
.assist-state b{min-width:22px;color:var(--ink2)}
.assist-state.on b{color:var(--g2)}
.wrap.home{margin:0 auto;padding:0 16px 120px}
.depts{grid-template-columns:1fr;gap:12px;grid-auto-rows:1fr}
.depts .row.dept{position:relative;min-height:86px}
.depts .row.dept .ft b{white-space:normal;line-height:1.3}
@media (max-width:379px){.home-tools{grid-template-columns:1fr}}
@media (min-width:720px){
.home-top{max-width:none;margin:0;padding:28px 40px 0;grid-template-columns:minmax(0,1fr) minmax(300px,460px);align-items:start;gap:28px}
.home-tools{grid-template-columns:minmax(0,1fr) auto}
.wrap.home{max-width:none;margin:0;padding:24px 40px 140px}
.wrap.home .foot{text-align:left}
.depts{grid-template-columns:repeat(auto-fill,250px);justify-content:start;gap:18px}
.depts .row.dept{flex-direction:column;align-items:flex-start;justify-content:space-between;gap:16px;min-height:178px;padding:20px}
.depts .row.dept .ico{width:54px;height:54px;flex-basis:54px}
.depts .row.dept .ico svg{width:26px;height:26px}
.depts .row.dept .ft{flex:0 0 auto;width:100%}
.depts .row.dept .ft b{font:600 19px/1.25 Georgia,"Times New Roman",serif;color:var(--g1);white-space:normal}
.depts .row.dept .chev{position:absolute;top:20px;right:20px}
}

/* page slides stay inside the screen; phone search and assistant switch fit side by side */
#app{overflow-x:clip}
@media (max-width:719px){
.home-tools #hq{font-size:15px;padding:0 16px}
.assist-state{padding:0 12px;gap:7px;font-size:13px}
}

/* installed app: status-bar safe area, install button, no pull-to-refresh */
html{overscroll-behavior-y:contain}
.top{padding-top:env(safe-area-inset-top,0px)}
#install{margin-left:auto;flex:0 0 auto;min-height:36px;padding:0 14px;border:1px solid rgba(255,255,255,.35);border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font:650 14px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;white-space:nowrap;cursor:pointer;transition:background .2s}
#install:hover{background:rgba(255,255,255,.26)}
#install[hidden]{display:none}

/* real photo background: used when background.jpg is uploaded next to index.html */
#scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 65%;display:block;user-select:none;-webkit-user-drag:none}
#scene.photo svg{display:none}
#scene.photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(246,251,241,.26) 0%,rgba(230,244,223,.1) 45%,rgba(230,244,223,.22) 100%)}

/* 2026 revision pack import on the home screen */
.pack-import{margin-top:20px;display:grid;gap:8px;justify-items:start}
.pack-import .hint{font-size:14px;color:var(--ink2);max-width:520px}

/* ----- Study Hub 2026.2: texture, type scale, dashboard, focus timer, settings, offline notice ----- */
:root{--grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .10  0 0 0 0 .22  0 0 0 0 .16  0 0 0 .55 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:var(--grain);opacity:.55;pointer-events:none}
html[data-motion=reduced] *,html[data-motion=reduced] *::before,html[data-motion=reduced] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
h2{font-size:clamp(24px,6.4vw,30px);letter-spacing:-.01em}
.top-acts{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-acts #install{margin-left:0}
.icon-btn{flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,.24)}
.icon-btn svg{width:22px;height:22px}
.dash{display:grid;gap:14px;margin-top:14px}

.dash-stats div{padding:14px 12px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 24px -18px rgba(23,49,39,.45);backdrop-filter:blur(8px)}
.dash-stats b{display:block;font:600 26px/1.05 Georgia,"Times New Roman",serif;color:var(--g1)}
.dash-stats small{display:block;margin-top:4px;font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.02em}
.cont{display:grid;gap:4px;width:100%;text-align:left;padding:16px 18px;border:0;border-radius:20px;background:linear-gradient(135deg,#2e6b4a,#1f4d36);color:#fff;box-shadow:0 16px 30px -18px rgba(23,49,39,.8);transition:transform .2s}
.cont:hover{transform:translateY(-2px)}
.cont-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#bfe3c9}
.cont b{font:600 19px/1.25 Georgia,"Times New Roman",serif}
.cont small{color:#d7eedd}
.timer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 24px -18px rgba(23,49,39,.45)}
.timer .cont-k{color:var(--g2)}
.timer #tmr{display:block;font:600 34px/1.05 Georgia,"Times New Roman",serif;color:var(--g1);font-variant-numeric:tabular-nums}
.timer-btns{display:flex;gap:8px;flex-wrap:wrap}
#net{position:fixed;top:0;left:0;right:0;z-index:40;padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:#7a5300;color:#fff;font-size:13px;font-weight:600;text-align:center}
#net[hidden]{display:none}
.sheet-scrim{position:fixed;inset:0;z-index:50;background:rgba(15,31,24,.35);backdrop-filter:blur(2px)}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:rgba(255,255,255,.97);box-shadow:0 -20px 50px -20px rgba(10,35,25,.6);animation:sheetUp .38s cubic-bezier(.2,.7,.2,1)}
@media (min-width:720px){.sheet{left:auto;right:24px;bottom:24px;width:min(420px,calc(100% - 48px));border-radius:24px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-h b{font:600 22px/1.2 Georgia,"Times New Roman",serif;color:var(--g1)}
.field{display:grid;gap:8px;margin-top:16px;font-size:14px;font-weight:650;color:var(--ink2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(46,107,74,.1)}
.seg button{min-height:40px;border:0;border-radius:11px;background:transparent;color:var(--ink2);font-weight:650}
.seg button[aria-pressed=true]{background:#fff;color:var(--g1);box-shadow:0 6px 14px -10px rgba(23,49,39,.5)}
.switch-row{display:flex;justify-content:space-between;align-items:center}
.sw-btn{position:relative;flex:0 0 52px;width:52px;height:30px;border:0;border-radius:999px;background:#c5d6c9;transition:background .25s}
.sw-btn::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s}
.sw-btn[aria-pressed=true]{background:var(--g3)}
.sw-btn[aria-pressed=true]::after{transform:translateX(22px)}
html[data-text=large] body{font-size:18px}
html[data-text=large] .row .ft b{font-size:18px}
html[data-text=large] .subj b,html[data-text=large] .mod b{font-size:21px}
html[data-text=large] .hero p,html[data-text=large] .intro{font-size:18px}
html[data-text=large] .frow b,html[data-text=large] .ft small,html[data-text=large] .subj small{font-size:15px}
html[data-text=large] .btn{font-size:17px}
html[data-text=large] .opt span{font-size:18px}
html[data-text=large] .ag-txt{font-size:17px}

/* desktop: dashboard lines up with the three department columns; import note sits on a glass card */
@media (min-width:720px){.dash{max-width:808px}}
.pack-import{padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 24px -18px rgba(23,49,39,.45);backdrop-filter:blur(8px);max-width:808px}

<input id="packpick" type="file" multiple accept=".zip,.pdf,.docx,.pptx" tabindex="-1" aria-hidden="true">
<div id="toast" role="status" aria-live="polite"></div>
<button id="assist-btn" class="assist-btn" data-a="assist-open" hidden>Assistant</button>
<aside id="assist" class="assist" hidden aria-label="Study assistant">
  <div class="assist-h"><b>Study assistant</b><span class="assist-acts"><button class="chip" data-a="assist-off">Turn off</button><button class="chip" data-a="assist-close">Close</button></span></div>
  <div class="assist-b">
    <div id="as-setup" class="ag-set" hidden>
      <label>Your API key<input id="as-key" type="password" autocomplete="off" placeholder="Paste your key"></label>
      <label>Model<select id="as-model"><option value="claude-sonnet-5-5">Sonnet 5.5 (most thorough)</option><option value="claude-haiku-5-5">Haiku 5.5 (faster, cheaper)</option></select></label>
      <div class="btns"><button class="btn sm" data-a="as-save">Save key</button></div>
      <p class="small">Your key stays in this browser only. Questions are billed to your Anthropic account. Notes are sent to Anthropic only when you ask.</p>
    </div>
    <label>Answer from<select id="as-scope" aria-label="Which notes to check"></select></label>
    <div id="as-out" class="as-out"></div>
  </div>
  <div class="assist-f">
    <textarea id="as-q" rows="2" placeholder="Ask anything about your notes" aria-label="Your question"></textarea>
    <div class="btns"><button class="btn sm" data-a="as-ask">Ask</button><button class="btn sm ghost" data-a="as-doubts">Check doubts</button><button class="btn sm ghost" data-a="as-clean">Clean note</button><button class="btn sm ghost" data-a="as-key">Key</button></div>
    <p id="as-status" class="small"></p>
  </div>
</aside>
<script>
'use strict';
/* ----- Data: maths questions and notes from your file (answer key already shuffled) ----- */
const CONTENT = {"maths": {"bank": [{"t": "Matrices and Determinants", "s": "Module 1", "u": "Matrix basics, operations, determinants, inverse and Cramer’s rule", "q": [{"q": "A matrix has 2 rows and 3 columns. What is its order?", "o": ["2 × 3", "6 × 1", "2 + 3", "3 × 2"], "a": 0, "e": "The order of a matrix is written as rows × columns. Therefore, 2 rows and 3 columns give order 2 × 3."}, {"q": "If A = [[5, 8, 2], [3, 6, 9]], what is the element a₂₃?", "o": ["3", "6", "9", "8"], "a": 2, "e": "a₂₃ means the element in row 2, column 3. That element is 9."}, {"q": "Which condition defines a square matrix?", "o": ["The number of rows equals the number of columns", "All elements are equal", "It has one row only", "All elements are zero"], "a": 0, "e": "A square matrix has the same number of rows and columns, such as 2 × 2 or 3 × 3."}, {"q": "Which of the following is a diagonal matrix?", "o": ["[[1, 1], [1, 1]]", "[[0, 4], [7, 0]]", "[[4, 0], [0, 7]]", "[[4, 2], [0, 7]]"], "a": 2, "e": "A diagonal matrix is square and every element outside the main diagonal is zero."}, {"q": "In an identity matrix, the diagonal elements are ______ and all other elements are ______.", "o": ["equal; unequal", "1; 0", "0; 1", "−1; 0"], "a": 1, "e": "An identity matrix has 1s on the main diagonal and 0s everywhere else."}, {"q": "If A is of order 2 × 3, what is the order of Aᵀ?", "o": ["2 × 3", "2 × 2", "3 × 2", "3 × 3"], "a": 2, "e": "Taking the transpose interchanges rows and columns. Hence 2 × 3 becomes 3 × 2."}, {"q": "If A = [[1, 2], [3, 4]] and B = [[4, 1], [0, 2]], what is the element in row 2, column 1 of A + B?", "o": ["1", "4", "3", "7"], "a": 2, "e": "Add corresponding elements. The required entry is 3 + 0 = 3."}, {"q": "If A = [[1, −3], [0, 4]], what is the element in row 1, column 2 of −2A?", "o": ["−3", "6", "−6", "3"], "a": 1, "e": "Scalar multiplication multiplies every entry by −2. Thus −2 × (−3) = 6."}, {"q": "For matrices A of order m × p and B of order p × n, what is the order of AB?", "o": ["m × n", "m × p", "n × m", "p × p"], "a": 0, "e": "Matrix multiplication is possible when the inner dimensions match. The product has the outer dimensions m × n."}, {"q": "The product of a 2 × 3 matrix and a 3 × 4 matrix, when defined, has what order?", "o": ["2 × 3", "4 × 2", "3 × 3", "2 × 4"], "a": 3, "e": "The inner dimensions 3 and 3 match. The resulting matrix has the outer dimensions 2 × 4."}, {"q": "Find the determinant of [[3, 2], [5, 4]].", "o": ["22", "2", "−1", "−2"], "a": 1, "e": "For [[a, b], [c, d]], determinant = ad − bc = 3 × 4 − 2 × 5 = 12 − 10 = 2."}, {"q": "The determinant of [[2, 3], [4, 5]] is:", "o": ["22", "2", "−1", "−2"], "a": 3, "e": "ad − bc = 2 × 5 − 3 × 4 = 10 − 12 = −2."}, {"q": "A square matrix with determinant zero is called:", "o": ["Non-singular", "Singular", "Identity", "Scalar"], "a": 1, "e": "A matrix with determinant 0 is singular and has no inverse."}, {"q": "Find the determinant of the upper triangular matrix [[2, 1, 0], [0, 3, 4], [0, 0, 5]].", "o": ["15", "10", "60", "30"], "a": 3, "e": "The determinant of a triangular matrix is the product of its diagonal entries: 2 × 3 × 5 = 30."}, {"q": "For A = [[1, 2, 3], [4, 5, 6], [7, 8, 9]], find the minor M₁₂.", "o": ["6", "−6", "−3", "3"], "a": 1, "e": "Delete row 1 and column 2. The remaining determinant is |4 6; 7 9| = 4 × 9 − 6 × 7 = 36 − 42 = −6."}, {"q": "If the minor M₁₂ = −6, what is the cofactor C₁₂?", "o": ["6", "12", "−6", "0"], "a": 0, "e": "Cᵢⱼ = (−1)ⁱ⁺ʲ Mᵢⱼ. Since 1 + 2 is odd, C₁₂ = −M₁₂ = 6."}, {"q": "What is the sign of the cofactor C₂₃?", "o": ["Positive", "Cannot be determined", "Negative", "Zero always"], "a": 2, "e": "The cofactor sign is (−1)^(i+j). For C₂₃, 2 + 3 = 5, which is odd, so the sign is negative."}, {"q": "Find the determinant of [[1, 2, 3], [0, 4, 5], [1, 0, 6]].", "o": ["22", "24", "20", "18"], "a": 0, "e": "Expand along the first row: 1(24) − 2(−5) + 3(−4) = 24 + 10 − 12 = 22."}, {"q": "The adjoint of a square matrix is the:", "o": ["Sum of its diagonal elements", "Inverse of its determinant", "Determinant of its transpose", "Transpose of its cofactor matrix"], "a": 3, "e": "The adjoint (adjugate) is obtained by taking the transpose of the cofactor matrix."}, {"q": "A square matrix has an inverse if and only if its determinant is:", "o": ["One", "Negative", "Non-zero", "Zero"], "a": 2, "e": "The inverse formula is A⁻¹ = adj(A)/|A|. It exists only when |A| ≠ 0."}, {"q": "Find the inverse of A = [[1, 2], [3, 4]].", "o": ["[[-2, 1], [3/2, −1/2]]", "[[2, −1], [−3/2, 1/2]]", "[[−2, −1], [−3/2, −1/2]]", "[[4, 2], [3, 1]]"], "a": 0, "e": "The determinant is 1×4 − 2×3 = −2. The adjoint is [[4, −2], [−3, 1]]. Dividing by −2 gives [[−2, 1], [3/2, −1/2]]."}, {"q": "For C = [[2, 4], [1, 2]], why does C have no inverse?", "o": ["Its trace is zero", "Its determinant is zero", "Its entries are positive", "It is not square"], "a": 1, "e": "The determinant is 2×2 − 4×1 = 0. A singular matrix has no inverse."}, {"q": "Solve the system 2x + y = 5 and x − y = 1.", "o": ["x = 2, y = 1", "x = 3, y = −1", "x = 1, y = 3", "x = 1, y = 2"], "a": 0, "e": "Adding the equations gives 3x = 6, so x = 2. Substituting into x − y = 1 gives y = 1."}, {"q": "In Cramer’s rule for two unknowns, D is the determinant of the:", "o": ["Dy matrix", "Dx matrix", "Constants column", "Coefficient matrix"], "a": 3, "e": "D is the determinant of the coefficient matrix. A unique solution exists when D ≠ 0."}, {"q": "Solve x + y + z = 6, x − y = 0 and z = 2.", "o": ["(3, 3, 0)", "(2, 1, 3)", "(1, 1, 4)", "(2, 2, 2)"], "a": 3, "e": "From z = 2 and x = y, the first equation gives 2x + 2 = 6. Thus x = y = 2 and z = 2."}]}, {"t": "Trigonometry", "s": "Module 2", "u": "Angles, trigonometric ratios, ASTC, reduction and compound angles", "q": [{"q": "An angle measuring 45° is classified as:", "o": ["Right", "Acute", "Obtuse", "Reflex"], "a": 1, "e": "An acute angle is greater than 0° and less than 90°. Therefore, 45° is acute."}, {"q": "An angle measuring 225° is classified as:", "o": ["Acute", "Straight", "Obtuse", "Reflex"], "a": 3, "e": "A reflex angle is greater than 180° and less than 360°. Therefore, 225° is reflex."}, {"q": "A straight angle measures:", "o": ["270°", "90°", "360°", "180°"], "a": 3, "e": "A straight angle measures exactly 180°."}, {"q": "In a right-angled triangle, sin θ is:", "o": ["Adjacent / hypotenuse", "Hypotenuse / opposite", "Opposite / hypotenuse", "Opposite / adjacent"], "a": 2, "e": "Sine is defined as the length of the side opposite θ divided by the hypotenuse."}, {"q": "In a right-angled triangle, cos θ is:", "o": ["Opposite / adjacent", "Opposite / hypotenuse", "Hypotenuse / adjacent", "Adjacent / hypotenuse"], "a": 3, "e": "Cosine is adjacent side divided by the hypotenuse."}, {"q": "The trigonometric ratio tan θ is equal to:", "o": ["sin θ / cos θ", "cos θ / sin θ", "1 / sin θ", "1 / cos θ"], "a": 0, "e": "The quotient identity is tan θ = sin θ / cos θ."}, {"q": "What is the value of sin 30°?", "o": ["√2/2", "1", "1/2", "√3/2"], "a": 2, "e": "The standard trigonometric value is sin 30° = 1/2."}, {"q": "What is the value of cos 60°?", "o": ["√3/2", "1/2", "1", "0"], "a": 1, "e": "The standard trigonometric value is cos 60° = 1/2."}, {"q": "What is the value of tan 45°?", "o": ["0", "1/√3", "1", "√3"], "a": 2, "e": "Since sin 45° and cos 45° are equal, tan 45° = 1."}, {"q": "A right triangle has hypotenuse 5 cm. For angle θ, the opposite side is 3 cm. Find sin θ.", "o": ["3/5", "4/5", "5/3", "3/4"], "a": 0, "e": "sin θ = opposite/hypotenuse = 3/5."}, {"q": "Which identity is correct for sec θ?", "o": ["sec θ = cos θ/sin θ", "sec θ = 1/sin θ", "sec θ = sin θ/cos θ", "sec θ = 1/cos θ"], "a": 3, "e": "Secant is the reciprocal of cosine: sec θ = 1/cos θ."}, {"q": "Which is the correct reciprocal identity?", "o": ["cosec θ = 1/sin θ", "cosec θ = 1/cos θ", "cosec θ = tan θ", "cosec θ = sin θ"], "a": 0, "e": "Cosecant is the reciprocal of sine: cosec θ = 1/sin θ."}, {"q": "Choose the correct Pythagorean identity.", "o": ["tan²θ + sec²θ = 1", "sin²θ + cos²θ = 1", "1 + sin²θ = cos²θ", "sin²θ − cos²θ = 1"], "a": 1, "e": "The fundamental Pythagorean relation is sin²θ + cos²θ = 1."}, {"q": "Which Pythagorean relation is correct?", "o": ["1 + sec²θ = tan²θ", "1 + tan²θ = sec²θ", "1 + cot²θ = sec²θ", "tan²θ − sec²θ = 1"], "a": 1, "e": "Dividing sin²θ + cos²θ = 1 by cos²θ gives tan²θ + 1 = sec²θ."}, {"q": "According to the ASTC rule, which ratio is positive in the third quadrant?", "o": ["Tangent only", "All three", "Sine only", "Cosine only"], "a": 0, "e": "ASTC means All in quadrant I, Sine in II, Tangent in III and Cosine in IV. Thus tangent is positive in quadrant III."}, {"q": "According to the ASTC rule, in which quadrant is cosine positive?", "o": ["First quadrant only", "Fourth quadrant", "Third quadrant", "Second quadrant"], "a": 1, "e": "The ASTC rule states that cosine is positive in the fourth quadrant (as well as all ratios in the first quadrant)."}, {"q": "If sin θ = 3/5 and θ is acute, find cos θ.", "o": ["4/5", "5/3", "3/5", "5/4"], "a": 0, "e": "For an acute angle, cosine is positive. Using sin²θ + cos²θ = 1 gives cos θ = √(1 − 9/25) = 4/5."}, {"q": "Evaluate sin 150°.", "o": ["−1/2", "√3/2", "1/2", "−√3/2"], "a": 2, "e": "sin 150° = sin(180° − 30°) = sin 30° = 1/2."}, {"q": "Evaluate cos 120°.", "o": ["√3/2", "−√3/2", "−1/2", "1/2"], "a": 2, "e": "cos 120° = cos(180° − 60°) = −cos 60° = −1/2."}, {"q": "Evaluate tan 225°.", "o": ["0", "−1", "√3", "1"], "a": 3, "e": "tan 225° = tan(180° + 45°) = tan 45° = 1."}, {"q": "Which reduction formula is correct?", "o": ["sin(360° − θ) = −sin θ", "cos(360° − θ) = −cos θ", "tan(360° − θ) = tan θ", "sin(360° − θ) = sin θ"], "a": 0, "e": "In the fourth quadrant sine is negative, so sin(360° − θ) = −sin θ."}, {"q": "Choose the correct co-function identity.", "o": ["sin(90° − θ) = −cos θ", "tan(90° − θ) = tan θ", "cos(90° − θ) = sin θ", "cos(90° − θ) = cos θ"], "a": 2, "e": "The reduction formula gives cos(90° − θ) = sin θ."}, {"q": "Which is the correct formula for sin(A + B)?", "o": ["cos A sin B + sin A cos B with a minus sign", "sin A cos B + cos A sin B", "cos A cos B − sin A sin B", "sin A cos B − cos A sin B"], "a": 1, "e": "The compound-angle identity is sin(A + B) = sin A cos B + cos A sin B."}, {"q": "Which is the correct formula for cos(A − B)?", "o": ["cos A cos B − sin A sin B", "cos A cos B + sin A sin B", "sin A cos B − cos A sin B", "sin A sin B − cos A cos B"], "a": 1, "e": "The compound-angle identity is cos(A − B) = cos A cos B + sin A sin B."}, {"q": "Using compound-angle identities, sin 75° is:", "o": ["(√3 − 1)/2", "(√3 + 1)/2", "(√6 − √2)/4", "(√6 + √2)/4"], "a": 3, "e": "sin 75° = sin(45° + 30°) = sin45 cos30 + cos45 sin30 = (√6 + √2)/4."}]}, {"t": "Coordinate Geometry", "s": "Module 3", "u": "Slope, straight-line equations, angles between lines and circles", "q": [{"q": "Find the slope of the line joining (1, 2) and (3, 6).", "o": ["2", "3", "1", "4"], "a": 0, "e": "Slope m = (y₂ − y₁)/(x₂ − x₁) = (6 − 2)/(3 − 1) = 4/2 = 2."}, {"q": "The slope of a horizontal line is:", "o": ["1", "0", "Undefined", "−1"], "a": 1, "e": "A horizontal line has no vertical change, so its slope is zero."}, {"q": "The slope of a vertical line is:", "o": ["0", "Undefined", "−1", "1"], "a": 1, "e": "For a vertical line, x₂ − x₁ = 0. Division by zero makes the slope undefined."}, {"q": "Which formula gives the slope through (x₁, y₁) and (x₂, y₂)?", "o": ["(y₁ − y₂)/(x₁ + x₂)", "(x₁ + x₂)/(y₁ + y₂)", "(y₂ − y₁)/(x₂ − x₁)", "(x₂ − x₁)/(y₂ − y₁)"], "a": 2, "e": "The slope is the change in y divided by the change in x: (y₂ − y₁)/(x₂ − x₁)."}, {"q": "A line has slope 2 and passes through (1, 3). Which is its slope-point equation?", "o": ["y − 1 = 3(x − 2)", "y − 3 = 2(x − 1)", "y + 3 = 2(x + 1)", "y = 2x − 3"], "a": 1, "e": "The slope-point form is y − y₁ = m(x − x₁). Substituting m = 2 and (x₁, y₁) = (1, 3) gives y − 3 = 2(x − 1)."}, {"q": "Find the equation of a line with slope −1 passing through (0, 4).", "o": ["y = −x − 4", "y = 4x − 1", "y = −x + 4", "y = x + 4"], "a": 2, "e": "Using y − 4 = −1(x − 0), we obtain y = −x + 4."}, {"q": "A line has slope 1. What is its angle of inclination?", "o": ["60°", "30°", "45°", "90°"], "a": 2, "e": "The slope m = tan θ. Since tan 45° = 1, the angle of inclination is 45°."}, {"q": "Find the angle between two lines with slopes 1 and −1.", "o": ["0°", "30°", "45°", "90°"], "a": 3, "e": "The slopes have product 1 × (−1) = −1, so the lines are perpendicular and the angle is 90°."}, {"q": "Which formula is used to find the angle θ between two lines of slopes m₁ and m₂?", "o": ["tan θ = m₁ − m₂", "tan θ = |(m₂ − m₁)/(1 + m₁m₂)|", "tan θ = (m₁ + m₂)/(1 − m₁m₂)", "tan θ = m₁m₂"], "a": 1, "e": "The angle formula is tan θ = |(m₂ − m₁)/(1 + m₁m₂)|, with the appropriate limiting case when the denominator is zero."}, {"q": "Two non-vertical lines are parallel when:", "o": ["Their y-intercepts are equal always", "Their slopes are reciprocals", "Their slopes multiply to −1", "Their slopes are equal"], "a": 3, "e": "Distinct non-vertical parallel lines have equal slopes."}, {"q": "Two non-vertical lines are perpendicular when:", "o": ["m₁m₂ = 1", "m₁ + m₂ = 0", "m₁ = m₂", "m₁m₂ = −1"], "a": 3, "e": "The condition for perpendicular lines is that the product of their slopes is −1."}, {"q": "Find the slope of the line 3x + 2y − 5 = 0.", "o": ["3/2", "2/3", "−3/2", "−2/3"], "a": 2, "e": "Rearrange: 2y = −3x + 5, so y = −(3/2)x + 5/2. The slope is −3/2."}, {"q": "Find the equation of the line parallel to 3x + 2y − 5 = 0 and passing through (1, 2).", "o": ["3x + 2y − 7 = 0", "2x + 3y − 7 = 0", "3x + 2y + 7 = 0", "3x − 2y + 1 = 0"], "a": 0, "e": "A parallel line has form 3x + 2y + k = 0. Substituting (1, 2) gives 3 + 4 + k = 0, so k = −7."}, {"q": "A line has slope −2. What is the slope of a line perpendicular to it?", "o": ["−2", "−1/2", "2", "1/2"], "a": 3, "e": "For perpendicular lines m₁m₂ = −1. Thus (−2)m₂ = −1, giving m₂ = 1/2."}, {"q": "Which is the standard equation of a circle with centre (h, k) and radius r?", "o": ["x² + y² + h + k = r", "(x − h)² + (y − k)² = r²", "(x + h)² + (y + k)² = r", "(x − h) + (y − k) = r²"], "a": 1, "e": "The standard circle equation is (x − h)² + (y − k)² = r²."}, {"q": "Find the equation of a circle with centre (2, −3) and radius 4.", "o": ["(x − 2)² + (y + 3)² = 16", "(x − 2)² + (y − 3)² = 4", "(x + 2)² + (y + 3)² = 16", "(x + 2)² + (y − 3)² = 16"], "a": 0, "e": "Substitute h = 2, k = −3 and r = 4 into (x − h)² + (y − k)² = r²."}, {"q": "For x² + y² + 6x − 8y − 11 = 0, what is the centre of the circle?", "o": ["(−3, 4)", "(3, −4)", "(−6, 8)", "(6, −8)"], "a": 0, "e": "Compare with x² + y² + 2gx + 2fy + c = 0. Here g = 3 and f = −4, so centre = (−g, −f) = (−3, 4)."}, {"q": "For x² + y² + 6x − 8y − 11 = 0, what is the radius?", "o": ["4", "7", "5", "6"], "a": 3, "e": "Here g = 3, f = −4 and c = −11. Radius = √(g² + f² − c) = √(9 + 16 + 11) = √36 = 6."}, {"q": "A circle has centre at the origin and radius 5. Its equation is:", "o": ["x² + y² = 10", "(x − 5)² + (y − 5)² = 25", "x² + y² = 5", "x² + y² = 25"], "a": 3, "e": "For centre (0, 0), x² + y² = r². With r = 5, the equation is x² + y² = 25."}, {"q": "In the general circle equation x² + y² + 2gx + 2fy + c = 0, the centre is:", "o": ["(2g, 2f)", "(g, f)", "(−g, −f)", "(−2g, −2f)"], "a": 2, "e": "Comparing the general equation with the expanded standard form gives centre (−g, −f)."}, {"q": "Find the centre of x² + y² − 4x + 6y − 12 = 0.", "o": ["(−4, 6)", "(−2, 3)", "(2, −3)", "(4, −6)"], "a": 2, "e": "Here 2g = −4 and 2f = 6, so g = −2 and f = 3. The centre is (−g, −f) = (2, −3)."}, {"q": "Find the radius of x² + y² − 4x + 6y − 12 = 0.", "o": ["5", "4", "6", "3"], "a": 0, "e": "g = −2, f = 3 and c = −12. Radius = √(g² + f² − c) = √(4 + 9 + 12) = √25 = 5."}, {"q": "Find the slope of the line joining (2, 3) and (6, 11).", "o": ["1", "2", "3", "4"], "a": 1, "e": "m = (11 − 3)/(6 − 2) = 8/4 = 2."}, {"q": "A straight line makes an angle of 30° with the positive x-axis. What is its slope?", "o": ["1/√3", "1", "√3", "0"], "a": 0, "e": "The slope is tan θ. Therefore m = tan 30° = 1/√3."}, {"q": "If two lines have slopes 2 and −1/3, what is tan of the acute angle between them?", "o": ["2/3", "3/7", "7", "1/7"], "a": 2, "e": "tan θ = |(m₂ − m₁)/(1 + m₁m₂)| = |(−1/3 − 2)/(1 − 2/3)| = |(−7/3)/(1/3)| = 7."}]}, {"t": "Differential Calculus", "s": "Module 4", "u": "Limits, derivatives, differentiation rules and second derivatives", "q": [{"q": "Evaluate limₓ→₂ (3x + 1).", "o": ["8", "7", "5", "6"], "a": 1, "e": "For a polynomial or linear function, direct substitution is valid: 3(2) + 1 = 7."}, {"q": "Evaluate limₓ→₋₁ (x² + 3x + 2).", "o": ["1", "−2", "0", "2"], "a": 2, "e": "Substitute x = −1: (−1)² + 3(−1) + 2 = 1 − 3 + 2 = 0."}, {"q": "Evaluate limₓ→₂ (x² − 4)/(x − 2).", "o": ["0", "6", "2", "4"], "a": 3, "e": "Factor x² − 4 = (x − 2)(x + 2). For x ≠ 2, the expression simplifies to x + 2, whose limit is 4."}, {"q": "Evaluate limₓ→₃ (x² − 9)/(x − 3).", "o": ["3", "9", "12", "6"], "a": 3, "e": "Factor x² − 9 = (x − 3)(x + 3). The limit is the value of x + 3 at x = 3, which is 6."}, {"q": "The standard trigonometric limit limₓ→₀ (sin x)/x is:", "o": ["0", "1", "−1", "Does not exist"], "a": 1, "e": "A standard limit used in differential calculus is limₓ→₀ sin x/x = 1, with x measured in radians."}, {"q": "Evaluate limₓ→₁ (x³ − 1)/(x − 1).", "o": ["3", "2", "4", "1"], "a": 0, "e": "Factor x³ − 1 = (x − 1)(x² + x + 1). The limit is 1² + 1 + 1 = 3."}, {"q": "Evaluate limₓ→₂ (x⁴ − 16)/(x − 2).", "o": ["8", "32", "16", "24"], "a": 1, "e": "Factor x⁴ − 16 = (x − 2)(x + 2)(x² + 4). At x = 2, the remaining product is 4 × 8 = 32."}, {"q": "Evaluate limₓ→₃ (x² + 2x + 5).", "o": ["24", "20", "18", "14"], "a": 1, "e": "Direct substitution gives 3² + 2(3) + 5 = 9 + 6 + 5 = 20."}, {"q": "The limit of a function as x approaches a describes:", "o": ["The value the function approaches near x = a", "The derivative at x = a", "Only the largest value of the function", "Always the value of the function at x = a"], "a": 0, "e": "A limit describes the value approached by a function as x gets close to a point; it need not equal the function’s value at that point."}, {"q": "Which expression gives the derivative by first principles?", "o": ["limₓ→₀ f(x)/x", "f(x + h) + f(x)", "f(x) × h", "limₕ→₀ [f(x + h) − f(x)]/h"], "a": 3, "e": "The derivative from first principles is f′(x) = limₕ→₀ [f(x + h) − f(x)]/h."}, {"q": "The derivative of a constant k with respect to x is:", "o": ["1", "x", "k", "0"], "a": 3, "e": "A constant does not change when x changes. Hence its derivative is zero."}, {"q": "Using the power rule, d/dx (xⁿ) is:", "o": ["xⁿ/n", "n xⁿ", "n xⁿ⁻¹", "xⁿ⁻¹"], "a": 2, "e": "The power rule states d(xⁿ)/dx = n xⁿ⁻¹."}, {"q": "The derivative of eˣ is:", "o": ["x eˣ⁻¹", "ln x", "eˣ", "1/x"], "a": 2, "e": "The exponential function eˣ is its own derivative: d(eˣ)/dx = eˣ."}, {"q": "The derivative of ln x is:", "o": ["x", "eˣ", "ln x", "1/x"], "a": 3, "e": "For x > 0, d(ln x)/dx = 1/x."}, {"q": "The derivative of sin x is:", "o": ["cos x", "−sin x", "tan x", "−cos x"], "a": 0, "e": "The standard derivative is d(sin x)/dx = cos x."}, {"q": "The derivative of cos x is:", "o": ["sin x", "−sin x", "cos x", "−cos x"], "a": 1, "e": "The standard derivative is d(cos x)/dx = −sin x."}, {"q": "The derivative of tan x is:", "o": ["−sec²x", "cosec²x", "sec²x", "−cosec²x"], "a": 2, "e": "The standard derivative is d(tan x)/dx = sec²x."}, {"q": "The derivative of cot x is:", "o": ["sec²x", "−cosec²x", "cosec²x", "−sec²x"], "a": 1, "e": "The standard derivative is d(cot x)/dx = −cosec²x."}, {"q": "Differentiate y = 5x³ − 2x + 7.", "o": ["15x² + 7", "5x² − 2", "15x³ − 2", "15x² − 2"], "a": 3, "e": "Differentiate each term: 5·3x² − 2 + 0 = 15x² − 2."}, {"q": "Differentiate y = x² sin x.", "o": ["2x sin x + x² cos x", "x² cos x − 2x sin x", "2x cos x", "2x + cos x"], "a": 0, "e": "Use the product rule: (x²)′sin x + x²(sin x)′ = 2x sin x + x² cos x."}, {"q": "If y = u(x)v(x), which is the product rule?", "o": ["y′ = u′v + uv′", "y′ = (u′v − uv′)/v²", "y′ = u + v", "y′ = u′v′"], "a": 0, "e": "The product rule is derivative of the first times the second, plus the first times derivative of the second: u′v + uv′."}, {"q": "If y = u(x)/v(x), which is the quotient rule?", "o": ["y′ = u′v + uv′", "y′ = u/v²", "y′ = (u′v − uv′)/v²", "y′ = v′/u′"], "a": 2, "e": "The quotient rule is (u′v − uv′)/v², where v ≠ 0."}, {"q": "For y = (x² + 1)/(x − 1), what is y′ at x = 2?", "o": ["0", "3", "1", "−1"], "a": 3, "e": "Using the quotient rule, y′ = [2x(x − 1) − (x² + 1)]/(x − 1)². At x = 2 this is (4 − 5)/1 = −1."}, {"q": "Find the second derivative of y = x⁴ − 3x² + 2x.", "o": ["12x² − 6", "24x² − 6", "4x³ − 6x + 2", "12x³ − 6x"], "a": 0, "e": "First derivative: y′ = 4x³ − 6x + 2. Differentiating again gives y″ = 12x² − 6."}, {"q": "Find the second derivative of y = ln x.", "o": ["1/x²", "1/x", "−1/x²", "−1/x"], "a": 2, "e": "First derivative is 1/x = x⁻¹. Differentiating again gives −x⁻² = −1/x²."}]}], "notes": [{"t": "Matrices and Determinants", "i": "A matrix is a rectangular arrangement of elements in rows and columns. The order is rows × columns. Matrices are used to organize data and solve systems of linear equations.", "s": [["Types of matrices", ["Row matrix: exactly one row. Column matrix: exactly one column.", "Square matrix: same number of rows and columns. Zero matrix: every entry is zero.", "Diagonal matrix: all off-diagonal entries are zero. Scalar matrix: diagonal entries are equal. Identity matrix: diagonal entries are 1 and all other entries are 0.", "Two matrices are equal only when they have the same order and corresponding elements are equal."]], ["Transpose and operations", ["Transpose Aᵀ: interchange rows and columns. If A is m × n, Aᵀ is n × m; (Aᵀ)ᵀ = A.", "Addition and subtraction are defined only for matrices of the same order; operate on corresponding entries.", "Scalar multiplication: multiply every element by the scalar.", "For AB, the number of columns of A must equal the number of rows of B. If A is m × p and B is p × n, AB is m × n."]], ["Determinants, minors and cofactors", ["For a 2 × 2 matrix [[a,b],[c,d]], |A| = ad − bc.", "For a 3 × 3 matrix, expand along a row or column using signed minors/cofactors.", "Minor Mᵢⱼ: delete row i and column j, then take the determinant of what remains.", "Cofactor Cᵢⱼ = (−1)ⁱ⁺ʲ Mᵢⱼ. The sign pattern begins + − + / − + − / + − +."]], ["Adjoint, inverse and Cramer’s rule", ["adj(A) is the transpose of the cofactor matrix.", "A⁻¹ = adj(A)/|A|. The inverse exists only if |A| ≠ 0. A matrix with determinant zero is singular.", "For two unknowns, D is the determinant of the coefficient matrix; Dx and Dy replace the relevant coefficient column by constants. x = Dx/D and y = Dy/D.", "Cramer’s rule also applies to three equations in three unknowns when the coefficient determinant is non-zero."]]], "x": "Check matrix dimensions before adding or multiplying. In determinant and inverse questions, calculate signs carefully. In Cramer’s rule, keep the order of columns consistent when forming Dx, Dy and Dz."}, {"t": "Trigonometry", "i": "Trigonometry studies relationships between angles and side ratios. In this module, angles, standard ratios, quadrant signs, reduction formulae and compound-angle identities are important.", "s": [["Angles and basic ratios", ["Acute: 0°–90°; right: 90°; obtuse: 90°–180°; straight: 180°; reflex: 180°–360°; complete: 360°.", "sin θ = opposite/hypotenuse; cos θ = adjacent/hypotenuse; tan θ = opposite/adjacent.", "Reciprocal identities: cosec θ = 1/sin θ; sec θ = 1/cos θ; cot θ = 1/tan θ.", "Quotient identities: tan θ = sin θ/cos θ; cot θ = cos θ/sin θ."]], ["Standard values and identities", ["sin 30° = 1/2; cos 60° = 1/2; sin 45° = cos 45° = 1/√2; tan 45° = 1.", "Pythagorean relations: sin²θ + cos²θ = 1; 1 + tan²θ = sec²θ; 1 + cot²θ = cosec²θ.", "If one ratio of an acute angle is given, use the Pythagorean identity and positivity of all acute-angle ratios to find the others."]], ["ASTC and reduction formulae", ["ASTC: All ratios are positive in quadrant I; sine is positive in II; tangent is positive in III; cosine is positive in IV.", "sin(180° − θ) = sin θ; cos(180° − θ) = −cos θ; tan(180° − θ) = −tan θ.", "sin(180° + θ) = −sin θ; cos(180° + θ) = −cos θ; tan(180° + θ) = tan θ.", "sin(360° − θ) = −sin θ; cos(360° − θ) = cos θ; tan(360° − θ) = −tan θ.", "Co-function examples: sin(90° − θ) = cos θ and cos(90° − θ) = sin θ."]], ["Compound angles", ["sin(A + B) = sin A cos B + cos A sin B.", "sin(A − B) = sin A cos B − cos A sin B.", "cos(A + B) = cos A cos B − sin A sin B.", "cos(A − B) = cos A cos B + sin A sin B.", "tan(A + B) = (tan A + tan B)/(1 − tan A tan B); tan(A − B) = (tan A − tan B)/(1 + tan A tan B)."]]], "x": "Before choosing a sign, identify the quadrant. For reduction formulae, first rewrite the angle using 90°, 180°, 270° or 360°, then apply the sign and reference angle."}, {"t": "Coordinate Geometry", "i": "Coordinate geometry connects algebra with points, lines and circles on the Cartesian plane.", "s": [["Slope and equations of straight lines", ["Slope through (x₁,y₁) and (x₂,y₂): m = (y₂ − y₁)/(x₂ − x₁), provided x₂ ≠ x₁.", "A horizontal line has slope 0; a vertical line has undefined slope.", "Slope-point form: y − y₁ = m(x − x₁). Slope-intercept form: y = mx + c.", "For ax + by + c = 0, the slope is −a/b when b ≠ 0."]], ["Angles and special line relationships", ["If θ is the inclination of a line, m = tan θ.", "Angle between two lines: tan θ = |(m₂ − m₁)/(1 + m₁m₂)|, when the denominator is non-zero.", "Parallel non-vertical lines have equal slopes: m₁ = m₂.", "Perpendicular non-vertical lines satisfy m₁m₂ = −1.", "A line parallel to ax + by + c = 0 has form ax + by + k = 0. A perpendicular line can be written bx − ay + k = 0."]], ["Circles", ["Standard equation: (x − h)² + (y − k)² = r², where centre is (h,k) and radius is r.", "A circle centred at the origin has equation x² + y² = r².", "General equation: x² + y² + 2gx + 2fy + c = 0.", "From the general equation, centre = (−g, −f) and radius = √(g² + f² − c)."]]], "x": "For line equations, find the slope first and then apply the point condition. For a circle in general form, compare coefficients carefully: 2g is the x coefficient and 2f is the y coefficient."}, {"t": "Differential Calculus", "i": "Differential calculus studies limits and rates of change. Differentiation gives the derivative, while successive differentiation produces second and higher derivatives.", "s": [["Limits", ["limₓ→ₐ f(x) describes the value approached by f(x) as x approaches a.", "For continuous polynomial expressions, direct substitution is usually valid.", "Factorisation is useful when direct substitution gives 0/0; cancel the common factor and then substitute.", "Important standard limit: limₓ→₀ (sin x)/x = 1, with x in radians.", "For n a positive integer, limₓ→ₐ (xⁿ − aⁿ)/(x − a) = n aⁿ⁻¹."]], ["Meaning and standard derivatives", ["Derivative from first principles: f′(x) = limₕ→₀ [f(x+h) − f(x)]/h.", "d(k)/dx = 0; d(xⁿ)/dx = n xⁿ⁻¹; d(eˣ)/dx = eˣ; d(ln x)/dx = 1/x.", "d(sin x)/dx = cos x; d(cos x)/dx = −sin x; d(tan x)/dx = sec²x.", "d(cosec x)/dx = −cosec x cot x; d(sec x)/dx = sec x tan x; d(cot x)/dx = −cosec²x."]], ["Rules of differentiation", ["Constant multiple: d[kf(x)]/dx = kf′(x). Sum/difference: d[f ± g]/dx = f′ ± g′.", "Product rule: d(uv)/dx = u′v + uv′.", "Quotient rule: d(u/v)/dx = (u′v − uv′)/v², for v ≠ 0."]], ["Second derivatives", ["The second derivative is the derivative of the first derivative: y″ = d²y/dx² = d(y′)/dx.", "Differentiate once to find y′, then differentiate the result again to find y″.", "Example: y = x⁴ − 3x² + 2x gives y′ = 4x³ − 6x + 2 and y″ = 12x² − 6.", "Example: y = ln x gives y′ = 1/x and y″ = −1/x²."]]], "x": "For limits, try substitution first; if it gives 0/0, factorise. For derivatives, identify whether the expression needs the power, product or quotient rule before calculating. Trigonometric derivative formulae assume angles are in radians."}]}, "physics": {"bank": [{"t": "Mechanics", "s": "Module 1", "u": "Units, vectors, Newton’s laws, friction and work", "q": [{"q": "Which of these is the SI unit of force?", "o": ["Joule", "Newton", "Watt", "Pascal"], "a": 1, "e": "The SI unit of force is the newton (N). One newton gives a 1 kg mass an acceleration of 1 m/s²."}, {"q": "The dimensions of velocity are", "o": ["[L T]", "[L T⁻¹]", "[L² T⁻¹]", "[M L T⁻¹]"], "a": 1, "e": "Velocity is displacement divided by time, so its dimensions are length divided by time: [L T⁻¹]."}, {"q": "Two perpendicular forces of 3 N and 4 N act on a body. What is the resultant?", "o": ["7 N", "1 N", "5 N", "12 N"], "a": 2, "e": "For perpendicular vectors, R = √(3² + 4²) = √25 = 5 N."}, {"q": "Newton’s second law is written as", "o": ["F = mv", "F = ma", "F = m / a", "F = a / m"], "a": 1, "e": "The net force equals mass times acceleration: F = ma."}, {"q": "A body stays at rest or in uniform motion unless a net force acts on it. This statement is", "o": ["Newton’s first law", "Newton’s second law", "Newton’s third law", "The law of conservation of energy"], "a": 0, "e": "This is Newton’s first law, also called the law of inertia."}, {"q": "The coefficient of friction is defined as", "o": ["μ = f N", "μ = N / f", "μ = f / N", "μ = f + N"], "a": 2, "e": "The coefficient of friction μ is the limiting friction f divided by the normal reaction N."}, {"q": "Work done by a force is zero when the force is", "o": ["parallel to the displacement", "at 45° to the displacement", "perpendicular to the displacement", "opposite to the displacement"], "a": 2, "e": "W = F s cos θ. When θ = 90°, cos θ = 0, so the work done is zero."}, {"q": "The SI unit of power is", "o": ["joule", "watt", "newton", "pascal"], "a": 1, "e": "Power is work done per unit time. Its SI unit is the watt, equal to one joule per second."}, {"q": "A 2 kg body moves with a speed of 3 m/s. Its kinetic energy is", "o": ["3 J", "6 J", "9 J", "12 J"], "a": 2, "e": "KE = ½ m v² = ½ × 2 × 3² = 9 J."}, {"q": "A 5 kg body moves at 4 m/s. Its momentum is", "o": ["1.25 kg m/s", "9 kg m/s", "20 kg m/s", "40 kg m/s"], "a": 2, "e": "Momentum p = m v = 5 × 4 = 20 kg m/s."}]}, {"t": "Properties of Matter", "s": "Module 2", "u": "Stress, strain, elastic moduli, viscosity and surface tension", "q": [{"q": "Stress is defined as", "o": ["force × area", "force / area", "area / force", "strain / force"], "a": 1, "e": "Stress = force / area. Its unit is N m⁻², which is the pascal (Pa)."}, {"q": "Strain has", "o": ["SI unit N m⁻²", "SI unit pascal", "no unit", "SI unit metre"], "a": 2, "e": "Strain is a ratio of two lengths, so it has no unit."}, {"q": "Young’s modulus is the ratio of", "o": ["shear stress to shear strain", "longitudinal stress to longitudinal strain", "volumetric stress to volumetric strain", "stress to area"], "a": 1, "e": "Young’s modulus Y = longitudinal stress / longitudinal strain."}, {"q": "Hooke’s law holds", "o": ["at all loads", "only beyond the elastic limit", "only within the elastic limit", "only for liquids"], "a": 2, "e": "Within the elastic limit, stress is proportional to strain. Beyond it the law no longer holds."}, {"q": "The SI unit of viscosity is", "o": ["N m⁻¹", "pascal second (Pa s)", "N m⁻²", "kg m⁻³"], "a": 1, "e": "Viscosity is measured in pascal second (Pa s), which equals N s m⁻²."}, {"q": "According to Stokes’ law, the viscous force on a small sphere is", "o": ["6πηrv", "4πηrv", "πηr²v", "6ηr²v"], "a": 0, "e": "Stokes’ law gives the viscous drag as F = 6πηrv, where η is viscosity, r the radius and v the speed."}, {"q": "Surface tension is defined as", "o": ["force × length", "force / length", "length / force", "energy × length"], "a": 1, "e": "Surface tension T = F / L. Its unit is newton per metre (N m⁻¹)."}, {"q": "The elastic limit of a material is the point beyond which", "o": ["it becomes a liquid", "it no longer returns fully to its original shape", "it stops conducting heat", "it has no stress"], "a": 1, "e": "Beyond the elastic limit the material stays permanently deformed when the load is removed."}, {"q": "A wire of area 1 mm² (1 × 10⁻⁶ m²) is pulled with a force of 100 N. The stress is", "o": ["1 × 10⁴ Pa", "1 × 10⁶ Pa", "1 × 10⁸ Pa", "1 × 10¹⁰ Pa"], "a": 2, "e": "Stress = F / A = 100 / (1 × 10⁻⁶) = 1 × 10⁸ Pa."}, {"q": "The modulus that relates shear stress to shear strain is the", "o": ["Young’s modulus", "shear modulus", "bulk modulus", "elastic limit"], "a": 1, "e": "The shear modulus G = shear stress / shear strain."}]}, {"t": "Rotational and Wave Motion", "s": "Module 3", "u": "Angular motion, moment of inertia, simple harmonic motion and waves", "q": [{"q": "A body rotates at a frequency of 50 Hz. Its angular velocity is", "o": ["50 rad/s", "100 rad/s", "100π rad/s", "50π rad/s"], "a": 2, "e": "ω = 2πf = 2π × 50 = 100π rad/s, which is about 314 rad/s."}, {"q": "Torque is given by", "o": ["τ = F / r", "τ = r F sin θ", "τ = r / F", "τ = F cos θ / r"], "a": 1, "e": "Torque τ = r F sin θ, where θ is the angle between the force and the radius vector."}, {"q": "The moment of inertia of a ring of mass M and radius R about its central axis is", "o": ["M R²", "½ M R²", "⅖ M R²", "2 M R"], "a": 0, "e": "Every particle of a ring is at distance R from the axis, so I = M R²."}, {"q": "The moment of inertia of a solid disc about its central axis is", "o": ["M R²", "½ M R²", "⅖ M R²", "¼ M R²"], "a": 1, "e": "For a solid disc or cylinder about its central axis, I = ½ M R²."}, {"q": "The period of a mass m on a spring of stiffness k is", "o": ["2π√(k/m)", "2π√(m/k)", "2π m k", "√(m/k)"], "a": 1, "e": "The period of a mass on a spring is T = 2π√(m/k)."}, {"q": "If the frequency of an oscillation is 4 Hz, its period is", "o": ["4 s", "0.25 s", "0.4 s", "2.5 s"], "a": 1, "e": "Period T = 1 / f = 1 / 4 = 0.25 s."}, {"q": "A wave has frequency 5 Hz and wavelength 2 m. Its speed is", "o": ["2.5 m/s", "7 m/s", "10 m/s", "0.4 m/s"], "a": 2, "e": "Wave speed v = f λ = 5 × 2 = 10 m/s."}, {"q": "In a transverse wave, the particles vibrate", "o": ["parallel to the direction of travel", "perpendicular to the direction of travel", "in circles only", "not at all"], "a": 1, "e": "In a transverse wave the particles vibrate perpendicular to the direction in which the wave travels."}, {"q": "Rotational kinetic energy is given by", "o": ["½ I ω", "I ω", "½ I ω²", "I ω²"], "a": 2, "e": "The rotational kinetic energy is ½ I ω²."}, {"q": "The angular momentum of a rotating body is", "o": ["I / ω", "I ω", "I ω²", "½ I ω"], "a": 1, "e": "Angular momentum L = I ω."}]}, {"t": "Thermal and Modern Physics", "s": "Module 4", "u": "Temperature scales, photoelectric effect, semiconductors and lasers", "q": [{"q": "Convert 100 °C to Fahrenheit.", "o": ["180 °F", "212 °F", "32 °F", "373 °F"], "a": 1, "e": "F = (9/5) × 100 + 32 = 180 + 32 = 212 °F."}, {"q": "Absolute zero on the Kelvin scale is", "o": ["0 K", "−273 K", "273 K", "−100 K"], "a": 0, "e": "Absolute zero is 0 K, which is equal to −273 °C."}, {"q": "Which equation gives the maximum kinetic energy of photoelectrons?", "o": ["KE = h f + φ", "KE = h f − φ", "KE = φ / h", "KE = f / φ"], "a": 1, "e": "Einstein’s photoelectric equation is KE(max) = h f − φ."}, {"q": "The threshold frequency of a metal is", "o": ["φ × h", "φ / h", "h / φ", "h f"], "a": 1, "e": "f₀ = φ / h. Light below this frequency does not eject electrons."}, {"q": "The photoelectric effect is evidence that light behaves as", "o": ["only a wave", "particles called photons", "sound waves", "a magnetic field"], "a": 1, "e": "The photoelectric effect shows that light energy comes in packets called photons."}, {"q": "A pentavalent impurity added to silicon creates", "o": ["holes", "extra electrons (n-type)", "no change", "insulation"], "a" function openDB() {

}

function loadViewer() {
  const f = files.find(x => x.id === R.id), box = $('#pv'), dl = $('#dl');
  if (!f || !box) return;
  url = URL.createObjectURL(f.blob);
  dl.href = url;
  dl.download = f.name;
  const k = kind(f), n = f.name.toLowerCase();
  if (k === 'photo') {
    const img = new Image();
    img.alt = f.name;
    img.onerror = () => { box.innerHTML = '<p>This browser cannot show this picture. Use Download.</p>'; };
    img.src = url;
    box.innerHTML = '';
    box.appendChild(img);
  } else if (k === 'video') {
    box.innerHTML = '<video src="' + url + '" controls playsinline preload="metadata"></video>';
  } else if (k === 'audio') {
    box.innerHTML = '<audio src="' + url + '" controls></audio>';
  } else if (/pdf/.test(f.type) || /\.pdf$/.test(n)) {
    box.innerHTML = '<iframe src="' + url + '" title="' + esc(f.name) + '"></iframe>';
  } else if (TEXT.test(n) || /^text\//.test(f.type)) {
    const rd = new FileReader();
    rd.onload = () => { box.innerHTML = ''; const pre = document.createElement('pre'); pre.textContent = rd.result; box.appendChild(pre); };
    rd.readAsText(f.blob.slice(0, 200000));
  } else {
    box.innerHTML = '<p>No preview for this file type. Use Download or Open in a new tab.</p>';
  }
}

  persistFile(f).then(() => toast('Moved to ' + subj(f.s).name + ': ' + sect(f.s, f.c).name + '.'), () => { f.s = old[0]; f.c = old[1]; toast('Could not move this file.'); });
}

/* ----- Study assistant: a side panel that answers from your notes, checking every note in the scope you choose ----- */
const SYSTEM = "You are the study assistant inside a first-year polytechnic student's app. Answer from the student's notes. Be correct, clear and brief. Explain in your own words and never copy long passages from the notes. Name the note you used.";
const NOT_FOUND = /^\s*NOT IN NOTES/i;
const LIMIT = 15000000;
const AS = {items: [], busy: false};
const IMG = {jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp'};
const asStatus = m => { const el = $('#as-status'); if (el) el.textContent = m; };
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => no(r.error); r.readAsDataURL(blob); });
const readText = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = () => no(r.error); r.readAsText(blob.slice(0, 200000)); });

const decode = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
const asScopeVal = () => ($('#as-scope') || {value: 'all'}).value;
function noteKind(f) {
  const e = ext(f.name), t = f.type || '';
  if (t === 'application/pdf' || e === 'pdf') return 'pdf';
  if (/^image\/(jpeg|png|gif|webp)$/.test(t) || IMG[e]) return 'image';
  if (e === 'docx' || e === 'pptx') return 'office';
  if (TEXT.test(f.name) || /^text\//.test(t)) return 'text';
  return '';
}
/* Word and PowerPoint files are zip archives: read the text parts straight out of them */
async function officeText(f) {
  const buf = new Uint8Array(await f.blob.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = buf.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error(f.name + ' could not be read. Save it as a PDF.');
  const want = f.name.toLowerCase().endsWith('.docx') ? /^word\/document\.xml$/ : /^ppt\/slides\/slide\d+\.xml$/;
  const parts = [];
  let p = dv.getUint32(e + 16, true);
  for (let i = 0; i < dv.getUint16(e + 10, true); i++) {
    const nl = dv.getUint16(p + 28, true), name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nl));
    if (want.test(name)) {
      const lo = dv.getUint32(p + 42, true), method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      const raw = buf.subarray(start, start + size);
      parts.push({name: name, xml: new TextDecoder().decode(method === 8 ? await inflate(raw) : raw)});
    }
    p += 46 + nl + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
  }
  parts.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
  return parts.map(x => decode(x.xml.replace(/<\/w:p>|<\/a:p>/g, '\n').replace(/<[^>]+>/g, ''))).join('\n\n').replace(/\n{3,}/g, '\n\n').trim();

async function noteBlocks(f) {
  const k = noteKind(f), label = {type: 'text', text: 'Note: ' + f.name};
  if (k === 'pdf') return [label, {type: 'document', source: {type: 'base64', media_type: 'application/pdf', data: await b64(f.blob)}}];
  if (k === 'image') return [label, {type: 'image', source: {type: 'base64', media_type: /^image\/(jpeg|png|gif|webp)$/.test(f.type || '') ? f.type : IMG[ext(f.name)], data: await b64(f.blob)}}];
  const body = k === 'office' ? await officeText(f) : await readText(f.blob);
  const cut = body.length > 80000;
  return [{type: 'text', text: 'Note: ' + f.name + '\n\n' + body.slice(0, 80000) + (cut ? '\n\n[This note was shortened to fit. The rest was not sent.]' : '')}];
}
async function callAgent(blocks, ask, max) {
  const key = localStorage.getItem('studyAgentKey');
  if (!key) throw new Error('Add your API key first. It is in the box at the top of the assistant.');
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);
  let res;
  try {
  res = await fetch('https://api.anthropic.com/v1/messages', {
    signal: ctl.signal,
    method: 'POST',
    headers: {'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({model: localStorage.getItem('studyAgentModel') || 'claude-sonnet-5-5', max_tokens: max, system: SYSTEM,
      messages: [{role: 'user', content: blocks.concat([{type: 'text', text: ask}])}]})
  });
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('The assistant took too long to answer. Try fewer notes.');
    throw err;
  } finally { clearTimeout(timer); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || 'The assistant could not answer (error ' + res.status + ').');

function scopeFiles() {
  const inSection = R.v === 'section' && asScopeVal() === 'section';
  return files.filter(f => !inSection || (f.s === R.s && f.c === R.c));
}
/* Batches stay under the request size limit and never hold more than six PDFs */
function batchesOf(list) {
  const out = [];
  let cur = [], bytes = 0, pdfs = 0;
  list.forEach(f => {
    const pdf = noteKind(f) === 'pdf';
    if (cur.length && (bytes + f.size > LIMIT || (pdf && pdfs >= 6))) { out.push(cur); cur = []; bytes = 0; pdfs = 0; }
    cur.push(f);
    bytes += f.size;
    if (pdf) pdfs++;
  });
  if (cur.length) out.push(cur);
  return out;
}
function instructionFor(kind, q) {
  if (kind === 'doubts') return 'List the points in these notes that a first-year student is most likely to find unclear, as at most five short questions, one per line. If nothing needs explaining, reply exactly: NOT IN NOTES';
  if (kind === 'clean') return 'Write a clean revision sheet from these notes: short headings, bullet points, key formulas or definitions, under 350 words, in your own words. If the notes have no study content, reply exactly: NOT IN NOTES';
  return 'Student question: ' + q + '\nCheck every note above. Give the most correct and appropriate answer in plain language, under 180 words, and name the note you used. If none of these notes answer the question, reply exactly: NOT IN NOTES';
}
function synthInstruction(kind, q) {
  if (kind === 'doubts') return 'These are partial lists from different notes. Merge them into one list of at most eight short questions, one per line, with no repeats.';
  if (kind === 'clean') return 'These are partial revision sheets from different notes. Merge them into one clean revision sheet under 450 words, with headings and bullet points.';
  return 'Student question: ' + q + '\nThese are partial answers, each from a different set of notes. Write the single most correct and appropriate answer in plain language, under 180 words. Name the notes used. Drop anything that contradicts the strongest answer.';
}
function generalInstruction(q) {
  return 'The student asked: ' + q + '\nNone of their notes answer this. Answer from general knowledge, correctly and clearly, under 180 words.';
}
async function askAssist(kind, q) {
  if (AS.busy) return;
  if (!localStorage.getItem('studyAgentKey')) { asSetup(true); return asStatus('Add your API key first. It is in the box at the top of the assistant.'); }
  const all = scopeFiles(), usable = all.filter(f => noteKind(f) && f.size <= LIMIT);
  const skipped = all.filter(f => usable.indexOf(f) === -1).map(f => f.name);
  if (!usable.length) return asStatus('No readable notes here yet. Use PDF, Word, PowerPoint, text or photo notes.');
  AS.busy = true;
  try {
    const batches = batchesOf(usable), partials = [];
    for (let i = 0; i < batches.length; i++) {
      asStatus('Going through batch ' + (i + 1) + ' of ' + batches.length + ' (' + plural(batches[i].length, 'note') + ')…');
      const blocks = [];
      for (const f of batches[i]) blocks.push(...(await noteBlocks(f)));
      partials.push(await callAgent(blocks, instructionFor(kind, q), kind === 'ask' ? 700 : 900));
    }
    const useful = partials.filter(p => !NOT_FOUND.test(p));
    let answer;
    if (!useful.length) {
      if (kind !== 'ask') return asStatus('Nothing useful was found in these notes.');
      asStatus('Not in your notes. Writing a general answer…');
      answer = 'Not in your notes. General answer:\n' + (await callAgent([], generalInstruction(q), 700));
    } else if (useful.length === 1) {
      answer = useful[0];
    } else {
      asStatus('Choosing the most appropriate answer…');
      answer = await callAgent([{type: 'text', text: useful.map((p, i) => 'Partial answer ' + (i + 1) + ':\n' + p).join('\n\n')}], synthInstruction(kind, q), 900);
    }
    AS.items.unshift({label: kind === 'ask' ? q : (kind === 'doubts' ? 'Doubts in your notes' : 'Clean note'), n: usable.length, a: answer});
    AS.items = AS.items.slice(0, 12);
    asPaint();
    asStatus('Checked ' + plural(usable.length, 'note') + (skipped.length ? '. Not read: ' + skipped.join(', ') : '') + '.');
  } catch (err) {
    asStatus(err instanceof TypeError ? 'Could not reach the assistant. Check your internet connection.' : err.message);
  } finally {
    AS.busy = false;
  }
}

}
